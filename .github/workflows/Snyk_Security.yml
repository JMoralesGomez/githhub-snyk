#==========================================================
# Pipeline DevSecOps
# Ejemplo educativo para una aplicación Python

stages:
  - secret_scan
  - build
  - security
  - test
  - container_scan
  - deploy

# 1. Detección de secretos
gitleaks:
  stage: secret_scan
  script:
    - gitleaks detect --source . --no-git

# 2. Construcción de la aplicación
build:
  stage: build
  script:
    - pip install -r requirements.txt
    - python -m compileall .

# 3. Análisis estático del código
sonarqube:
  stage: security
  script:
    - sonar-scanner

# 4. Análisis de dependencias
snyk:
  stage: security
  script:
    - snyk test --severity-threshold=high

# 5. Pruebas automatizadas
tests:
  stage: test
  script:
    - pytest

# 6. Construcción y análisis de imagen
container_scan:
  stage: container_scan
  script:
    - docker build -t aplicacion:latest .
    - trivy image --exit-code 1 --severity HIGH,CRITICAL aplicacion:latest

# 7. Despliegue
deploy:
  stage: deploy
  script:
    - echo "Ejecutar despliegue en ambiente autorizado"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

