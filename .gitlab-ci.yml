stages:
  - validate
  - test
  - security
#  - SAST-SONAR
  - build
  - container_scan
  - publish
  - deploy
  - verify

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  IMAGE_SHA: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  IMAGE_RELEASE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  
.python_job:
  image: python:3.12-slim
  cache:
    key:
      files:
        - pyproject.toml
    paths:
      - .cache/pip
  before_script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"

##lint:
  #extends: .python_job
  #stage: validate
  #script:
  #  - ruff check .
  #  - ruff format --check .

types:
  extends: .python_job
  stage: validate
  script:
    - mypy src

unit_tests:
  extends: .python_job
  stage: test
  script:
    - pytest --junitxml=report.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
    expire_in: 1 week

sast_bandit:
  extends: .python_job
  stage: security
  script:
    - bandit -r src -f json -o bandit-report.json
  artifacts:
    when: always
    paths:
      - bandit-report.json
    expire_in: 1 week

dependency_audit:
  image: node:18

  stage: security

  script:
      -   apt-get update && apt-get install -y python3 python3-venv python3-pip #se actualiza entorno e instala versión de python b
      -   python3 -m venv venv #entorno virtual llamado venv para aislar dependencias
      -   source venv/bin/activate #se activa entorno virtual
      -   pip install -r requerimiento.txt #se instalan las dependencias Flask de python dependiendo de la versión proporcionada en el archivo de texto
      -   npm install -g snyk
      -   snyk auth $SNYK_TOKEN #el tocken de skyk para su comunicación
      -   snyk test --file=requerimiento.txt --package-manager=pip || true
      -   snyk monitor --file=requerimiento.txt --package-manager=pip

#  artifacts:
#    when: always
#    paths:
#      - snyk-report.json
#    expire_in: 1 week
    
secret_detection:
  image:
    name: zricethezav/gitleaks:v8.28.0
    entrypoint: [""]
  stage: security
  script:
    - gitleaks detect --source . --no-banner --redact --report-format json --report-path gitleaks-report.json
  artifacts:
    when: always
    paths:
      - gitleaks-report.json
    expire_in: 1 week

filesystem_scan:
  image:
    name: aquasec/trivy:0.65.0
    entrypoint: [""]
  stage: security
  script:
    - trivy fs --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress .

sbom:
  image:
    name: aquasec/trivy:0.65.0
    entrypoint: [""]
  stage: security
  script:
    - trivy fs --format cyclonedx --output gl-sbom.cdx.json .
  artifacts:
    reports:
      cyclonedx: gl-sbom.cdx.json
    paths:
      - gl-sbom.cdx.json
    expire_in: 1 week

